<h2 mat-dialog-title>{{ esEdicion ? 'Editar artículo' : 'Nuevo artículo' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Categoría</mat-label>
      <input matInput formControlName="categoria">
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Ubicación</mat-label>
      <input matInput formControlName="ubicacion">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="cantidad">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Valor estimado</mat-label>
      <input matInput type="number" formControlName="valorEstimado">
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Fecha de caducidad</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fechaCaducidad">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="campo-completo">
      <mat-label>Notas</mat-label>
      <textarea matInput formControlName="notas" rows="2"></textarea>
    </mat-form-field>

    @if (error()) {
    <p class="mensaje-error">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()" [disabled]="guardando()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando()">
      @if (guardando()) {
      <mat-spinner diameter="20"></mat-spinner>
      } @else {
      Guardar
      }
    </button>
  </mat-dialog-actions>
</form>
